<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background-color:#f8f9fb;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f8f9fb;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background-color:#ffffff;border:1px solid #e2e8f0;border-radius:16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
            <tr>
              <td style="padding:32px 32px 0;font-size:20px;font-weight:700;color:#007a55;">TaxVault</td>
            </tr>
            <tr>
              <td style="padding:24px 32px 0;font-size:24px;line-height:32px;font-weight:700;color:#0f172a;">Confirm your email</td>
            </tr>
            <tr>
              <td style="padding:12px 32px 0;font-size:16px;line-height:24px;color:#334155;">
                Welcome to TaxVault. Confirm your email address to finish setting up your account and start tracking your receipts and expenses.
              </td>
            </tr>
            <tr>
              <td style="padding:24px 32px 0;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 24px;background-color:#007a55;border-radius:12px;color:#ffffff;font-size:16px;font-weight:700;text-decoration:none;">Confirm email address</a>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 32px 32px;font-size:14px;line-height:20px;color:#64748b;">
                If you didn't create a TaxVault account, you can safely ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
